version: "3.3"
services:
  viyaapi:
      image: docker.com/org/yourimage
      restart: always
      ports:
        - 8080:8080
      environment:
        - VIYA_SERVER=https://viyaserver.com
        - CLIENTID=viyaapp
        - CLIENTSECRET=secret
        - APPNAME=viyaap
        - SSLCERT=/certs
        - LOGLEVEL=info
      volumes:
         - c:/certs:/certs
