apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./namespace.yaml
  - ../../base

namespace: viyaapp

configMapGenerator:
  - name: viyaapp-configmap
    literals:
      - VIYA_SERVER=https://viyaserver.com
      - DEBUG=*
    
    
