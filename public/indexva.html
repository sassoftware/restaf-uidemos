		<script>
			debugger;
			let LOGONPAYLOAD = {
				host: "https://viya.kumar-ht1-azure-nginx-cec876bd.unx.sas.com",
				authType: 'server'
			}
			let store = restaf.initStore({
				casProxy: true});
			debugger;	
			console.log(store.config);
			console.log(restaflib.caslRun);

			let session = null;
			let servers = null;
			let services = null;
			let files = null;
			let reports = null;
			let computeSession = null;

			function setup() {
				debugger;
				document.getElementById('output').innerHTML = '...initializing';
				
				initSession()
					.then(r => {
						document.getElementById('output').innerHTML = 'ready';
						keepAlive();
					})
					.catch(e => {
						
						console.log(e);
					});
			}
			function keepAlive() {
				if (LOGONPAYLOAD.keepAlive != null) {
					let interval = 120;
					let timeout = 14400;
					if (LOGONPAYLOAD.timers != null) {
						let opts = LOGONPAYLOAD.timers.split(',');
						interval = parseInt(opts[ 0 ]);
						timeout = parseInt(opts[ 1 ]);
					}
					console.log(`Keepalive is active`);
					store.keepViyaAlive(LOGONPAYLOAD.keepAlive, interval, timeout, () => {
						console.log('timed out at', Date());
						let params = `scrollbars=no,resizable=no,status=no,location=no,toolbar=no,menubar=no,width=0,height=0,left=-1000,top=-1000`;
						window.open(`${appOptions.logonPayload.host}/SASLogon/timedout`, 'Timed Out', params);
						return true;
					});
				}

			}
			function logoff() {
				let url = `${window.location.protocol}//${window.location.host}/${LOGONPAYLOAD.appName}/logout?callbackUrl=onlogoff.html`;
				window.location.replace(url);

					
			}
			async function initSession() {
				
				// console.log(APPENV);
				console.log(LOGONPAYLOAD);
				debugger;
				let msg = await store.logon(LOGONPAYLOAD);
				console.log(msg);
				let name = 'user';
				
				return 'done';
			}
			function runit(type) {
		
				document.getElementById('output').innerHTML = '...running';
				let testcase;
				switch (type) {
					case 'files': {
						testcase = SASfileService;
						break;
					}
					case 'compute': {
						testcase = dsCompute;
						break;
					}
					case 'cas': {
						testcase = runCas;
						break;
					}
					case 'casl': {
						testcase = runCasl;
						break;
					}
					case 'timedout': {
						testcase = timedout;
						break;
					}
					case 'redir': {
						testcase= noaction;
						
						break;
					}
					case 'spre': {
						testcase= spre;
						
						break;
					}
					default: {
						testcase = SASfileService;
						break;
					}
				}

				testcase(store)
					.then(r => {
						document.getElementById(
							'output'
						).innerHTML = JSON.stringify(r, null, 4);
					})
					.catch(err => {
						
						document.getElementById(
							'output'
						).innerHTML = JSON.stringify(err, null, 4);
					});
			}
			async function noaction() {
				r = {msg: 'redirects completed'};
				return r;
			}
			async function spre(store) {
				let p = {
					method: 'GET',
					url   : 'http://localhost:3000/api/test',
					withCredentials: true
				}
				let r = await store.request(p);
				return r.data;
			}
			async function timedout(store) {
				console.log('timed out at', Date() );
				let params = `scrollbars=no,resizable=no,status=no,location=no,toolbar=no,menubar=no,width=0,height=0,left=-1000,top=-1000`;
				window.open(`${LOGONPAYLOAD.host}/SASLogon/timedout`,'Timed Out', params);
				return true;
			}
			
			async function runCasl(store) {
				
				if (session == null) {
				  let rx = await restaflib.casSetup(store, null);
					session = rx.session
				}
				debugger;
				console.log('session', session.links());
				console.log(restaflib.caslRun);
				let src = `action builtins.echo / code='hello world'; run;send_response({casResults={x=1}});`;
				let output = await restaflib.caslRun(store, session, src, {}, true);
				console.log(output);
				let xsrf = store.getXsrfData();
				console.log(xsrf);

				return output;
	};
	
	async function runCas(store) {
				
				if (session == null) {
				  let rx = await restaflib.casSetup(store, null);
					session = rx.session;
				}
				debugger;
				let src = `action builtins.echo / code='hello world'; run;send_response({casResults={x=1}});`;
				debugger;
				let output = await restaflib.caslRun(store, session, src, {}, true);
				debugger;
				console.log(output);
				let xsrf = store.getXsrfData();
				console.log(xsrf);

				return output;
	};

			async function SASfileService(store) {
				debugger;
				try {
					debugger;
				debugger
				let {files} = await store.addServices('files');
				debugger;
				console.log(JSON.stringify(files.links(), null, 4));
				console.log('items - should be an array of files(empty array is ok)')
				console.log(files.items().toJS());
				let payload = {
					data: { x: 1, y: 'This was saved earlier in the step' },
					headers: { 'content-type': 'application/json' }
				};
				let createCmd = files.links('create');
				let newFile = await store.apiCall(createCmd, payload);

				let content = await store.apiCall(newFile.links('content'));
				return content.items();
			} catch(err) {
				console.log(err);
				debugger;
			}
				
			}
			async function dsCompute(store) {
				debugger;
				if (computeSession == null) {
					computeSession = await restaflib.computeSetup(store, null);
					debugger;
				}
				let src = `data _null_; do i = 1 to 100; x=1; end; run; `;

				let computeSummary = await restaflib.computeRun(store, computeSession, src, {}); 
				debugger;
				let log = await restaflib.computeResults(store, computeSummary, 'log');
				debugger;
				return log;
			}
		</script>
